{{define "home"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/pages/home.css?v=5">
    <link rel="stylesheet" href="/static/css/components/header.css?v=5">
    <link rel="stylesheet" href="/static/css/components/footer.css?v=5">
    <link rel="stylesheet" href="/static/css/components/accessibility.css?v=1">
    <title>MetaRock</title>
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {{template "header" .}}

    <main id="main-content">
        <section class="hero-container" aria-label="Artist search">
            <div class="carousel" id="carousel" role="region" aria-roledescription="carousel" aria-label="Rock images" tabindex="0">
                <div class="carousel-inner" id="carousel-inner">
                    <img src="/static/images/logo.png" class="carousel-item active" alt="MetaRock logo">
                    <img src="/static/images/rock.png" class="carousel-item" alt="">
                    <img src="/static/images/roll.png" class="carousel-item" alt="">
                    <img src="/static/images/guitar.png" class="carousel-item" alt="">
                    <img src="/static/images/caveiras.png" class="carousel-item" alt="">
                </div>
                <button type="button" class="carousel-btn prev" id="prev-btn" aria-label="Previous slide">❮</button>
                <button type="button" class="carousel-btn next" id="next-btn" aria-label="Next slide">❯</button>
                <button type="button" class="carousel-toggle" id="carousel-toggle" aria-label="Pause carousel" aria-pressed="false">Pause</button>
            </div>

            <form action="/artists" method="GET" class="search-form-overlay" id="artist-search">
                <div class="search-bar">
                    <label class="sr-only" for="artist-query">Artist name</label>
                    <input id="artist-query" type="search" name="q" class="search" placeholder="Type an artist..." maxlength="30" autocomplete="off" value="{{.Query}}" required>
                    <button type="submit" class="search-btn">Search</button>
                </div>
            </form>
        </section>

        <section aria-label="Featured artists">
            {{range .Artists}}
            <article>
                <img src="{{.Image}}" alt="Portrait of {{.Name}}">
                <h2>{{.Name}}</h2>
            </article>
            {{end}}
        </section>
    </main>

    {{template "footer" .}}

    <script src="/static/JS/home.js"></script>
</body>

</html>
{{end}}
